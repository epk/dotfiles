version: 2

# Dependabot updates GitHub Actions. It does not update Nix flake inputs.
# update-flake-lock.yml updates flake.lock through a PR.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:41"
    # Wait a week before a new action release can run in this repository.
    cooldown:
      default-days: 7
    labels:
      - dependencies
