version: 2

# Dependabot has no Nix/flake ecosystem. It only keeps the pinned action
# versions in .github/workflows current; flake.lock is handled by
# .github/workflows/update-flake-lock.yml.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:41"
    labels:
      - dependencies
