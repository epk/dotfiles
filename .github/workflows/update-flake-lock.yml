name: update-flake-lock

on:
  schedule:
    - cron: "37 6 * * 1"
  workflow_dispatch:

concurrency:
  group: update-flake-lock
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Update pinned dependencies
        run: |
          nix flake update
          python3 automation/update-antigravity.py
      - name: Open update PR, run CI and wait for the merge
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if git diff --quiet -- flake.lock packages/antigravity-release.json; then exit 0; fi
          automation/open-bot-pr.sh automation/flake-lock-update 'flake.lock: Update' \
            'Update the pinned inputs and CLI release. All required CI checks must pass before the PR can merge.' \
            flake.lock packages/antigravity-release.json
