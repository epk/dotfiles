# Dependabot has no Nix ecosystem, so flake.lock is bumped by this scheduled
# job instead. .github/dependabot.yml keeps the actions below current.
name: update-flake-lock

on:
  schedule:
    - cron: "37 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Update flake.lock
        run: nix flake update

      - name: Commit and push
        run: |
          if git diff --quiet -- flake.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "flake.lock: Update"
          git push origin HEAD:main
