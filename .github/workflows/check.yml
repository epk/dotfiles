name: check

on:
  push:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-latest, system: x86_64-linux }
          - { name: darwin, os: macos-26, system: aarch64-darwin }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: epk
          skipPush: true

      # Each host pins nixpkgs.hostPlatform, so Linux also evaluates the Mac hosts.
      - name: Evaluate all outputs
        if: matrix.name == 'linux'
        run: nix flake check --all-systems --no-build --abort-on-warn --option allow-import-from-derivation false

      # The checks include the host outputs. A check that a cache holds is not built or downloaded.
      # One build at a time: the VM test fails when other builds take its CPU.
      - name: Build the uncached checks
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: >-
          nix run --inputs-from . nixpkgs#nix-fast-build --
          --skip-cached --no-nom --max-jobs 1 --cachix-cache epk --flake .#checks.${{ matrix.system }}

      - name: Check that the deployed hosts find their outputs
        if: matrix.name == 'linux'
        run: nix eval --impure --raw --file .github/check-live.nix
