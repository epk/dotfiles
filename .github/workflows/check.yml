name: check

on:
  push:
    branches: ["**"]

# A new main run waits. Cancellation would hide the result of a deployment that the agent continues.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-latest, system: x86_64-linux }
          - { name: darwin, os: macos-26, system: aarch64-darwin }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: epk
          skipPush: true

      # Each host pins nixpkgs.hostPlatform, so Linux also evaluates the Mac hosts.
      - name: Evaluate all outputs
        if: matrix.name == 'linux'
        run: nix flake check --all-systems --no-build --abort-on-warn --option allow-import-from-derivation false

      # The checks include the host outputs. A check that a cache holds is not built or downloaded.
      # One build at a time: the VM test fails when other builds take its CPU.
      # nix-fast-build comes from the lock of main. Code from an unmerged lock update must not run with the token.
      - name: Build the uncached checks
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: >-
          nix run --inputs-from github:epk/dotfiles/main nixpkgs#nix-fast-build --
          --skip-cached --no-nom --max-jobs 1 --cachix-cache epk --flake .#checks.${{ matrix.system }}

  # The agent downloads the server closure, then activates it.
  # It rolls back if it cannot reach Cachix after the activation.
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: deploy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: epk
          skipPush: true
      # The cache can remove a dependency after the check. Get the full closure. Upload the missing paths.
      - name: Build the server closure
        id: server
        run: |
          server=.#nixosConfigurations.server.config
          path=$(nix build --no-link --print-out-paths "$server.system.build.toplevel")
          agent=$(nix eval --raw "$server.services.cachix-agent.name")
          printf 'path=%s\nagent=%s\n' "$path" "$agent" >>"$GITHUB_OUTPUT"
      - name: Upload the server closure
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          SERVER: ${{ steps.server.outputs.path }}
        run: cachix push epk "$SERVER"
      - name: Deploy the server
        env:
          CACHIX_ACTIVATE_TOKEN: ${{ secrets.CACHIX_ACTIVATE_TOKEN }}
          AGENT: ${{ steps.server.outputs.agent }}
          SERVER: ${{ steps.server.outputs.path }}
        run: |
          jq -n --arg agent "$AGENT" --arg path "$SERVER" '{agents: {($agent): $path}}' >deploy.json
          cachix deploy activate deploy.json
