name: rotate-tailscale

on:
  push:
    branches: [main]
    paths:
      - automation/tailscale-targets.json
      - automation/rotate-tailscale.py
      - automation/open-bot-pr.sh
      - .github/workflows/rotate-tailscale.yml
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

concurrency:
  group: tailscale-credentials
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  rotate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # An app token, unlike GITHUB_TOKEN, starts CI for the bot pushes and the merge.
      - id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ steps.token.outputs.token }}
      # This job can create enrollment keys. Install age from Ubuntu, not with a third-party installer.
      - name: Install age
        run: sudo apt-get update && sudo apt-get install -y age
      - name: Create encrypted enrollment credentials
        env:
          TS_CLIENT_ID: ${{ vars.TS_CLIENT_ID }}
          TS_AUDIENCE: ${{ vars.TS_AUDIENCE }}
          CREDENTIAL_OUTPUT: ${{ runner.temp }}/tailscale-credentials
        run: python3 automation/rotate-tailscale.py
      - name: Open credential PR, run CI and wait for the merge
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          CREDENTIAL_OUTPUT: ${{ runner.temp }}/tailscale-credentials
        run: |
          mkdir -p secrets/tailscale
          cp "$CREDENTIAL_OUTPUT"/*.age secrets/tailscale/
          automation/open-bot-pr.sh automation/tailscale-update 'Tailscale: Refresh enrollment keys' \
            'Refresh encrypted enrollment keys. Required CI checks control merge.' secrets/tailscale
